# ==============================================================================
# DREAM CAR HOUSE - Production SSL Docker Compose Override
# ==============================================================================
# Usage with base docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.ssl.yml --env-file .env.production up -d
#
# IMPORTANT CLOUDFLARE SSL NOTICE:
# In the Cloudflare Dashboard (SSL/TLS Overview), you MUST select:
#   [x] Full (strict)
# NEVER use "Flexible" mode! Flexible mode causes an infinite 301 HTTP redirect
# loop because Cloudflare connects over HTTP (port 80) while Nginx enforces HTTPS.
# ==============================================================================

services:
  nginx:
    ports:
      - "443:443"
    volumes:
      - ./nginx/production-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro

