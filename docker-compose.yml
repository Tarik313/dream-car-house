services:
  # 1. PostgreSQL Production Database
  postgres:
    image: postgres:16-alpine
    container_name: dch_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dreamcarhouse_db}
      POSTGRES_USER: ${POSTGRES_USER:-dch_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dch_user} -d ${POSTGRES_DB:-dreamcarhouse_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dch_network

  # 2. Redis In-Memory Cache & Message Broker (volatile-lru prevents eviction of Celery queues)
  redis:
    image: redis:7-alpine
    container_name: dch_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dch_network

  # 3. Django REST API Backend (Gunicorn)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dch_backend
    restart: unless-stopped
    env_file:
      - .env.production
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2 --timeout 60"
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.production
      - DATABASE_URL=postgres://${POSTGRES_USER:-dch_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.production}@postgres:5432/${POSTGRES_DB:-dreamcarhouse_db}
      - REDIS_URL=redis://redis:6379/1
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:?ALLOWED_HOSTS must be set in .env.production}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set in .env.production}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:?CSRF_TRUSTED_ORIGINS must be set in .env.production}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env.production}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:?PUBLIC_BASE_URL must be set in .env.production}
      - JTRO_DEBUG=${JTRO_DEBUG:-False}
      - JTRO_SSL_ENABLED=${JTRO_SSL_ENABLED:-False}
      - JTRO_HSTS_SECONDS=${JTRO_HSTS_SECONDS:-3600}
    volumes:
      - static_volume:/app/static_root/static
      - media_volume:/app/media_root/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dch_network

  # ---------------------------------------------------------------------------
  # Celery Asynchronous Worker (Disabled: zero background tasks in codebase)
  # core/celery.py and core/__init__.py remain fully configured for Celery.
  # To re-enable Celery worker when async tasks (e.g. email queues) are added:
  # 1. Uncomment the 'celery' service block below.
  # 2. Add CELERY_BROKER_URL and CELERY_RESULT_BACKEND to .env.production.
  # 3. Re-run: docker compose --env-file .env.production up -d celery
  # ---------------------------------------------------------------------------
  # celery:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   container_name: dch_celery
  #   restart: unless-stopped
  #   env_file:
  #     - .env.production
  #   command: celery -A core worker -l info --concurrency=2
  #   environment:
  #     - DJANGO_SETTINGS_MODULE=core.settings.production
  #     - DATABASE_URL=postgres://${POSTGRES_USER:-dch_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.production}@postgres:5432/${POSTGRES_DB:-dreamcarhouse_db}
  #     - REDIS_URL=redis://redis:6379/1
  #     - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
  #     - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
  #     - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env.production}
  #   volumes:
  #     - media_volume:/app/media_root/media
  #   depends_on:
  #     backend:
  #       condition: service_started
  #     redis:
  #       condition: service_healthy
  #   logging:
  #     driver: "json-file"
  #     options:
  #       max-size: "10m"
  #       max-file: "3"
  #   networks:
  #     - dch_network

  # 5. Next.js Luxury Frontend (SSR)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL:?NEXT_PUBLIC_BASE_URL must be set in .env.production}
        - INTERNAL_BACKEND_URL=${INTERNAL_BACKEND_URL:-http://backend:8000}
    container_name: dch_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - INTERNAL_BACKEND_URL=${INTERNAL_BACKEND_URL:-http://backend:8000}
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL:?NEXT_PUBLIC_BASE_URL must be set in .env.production}
      - PORT=3000
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dch_network

  # 6. Node.js Custom Dynamic Workspace Dashboard
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: dch_custom_dashboard
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - INTERNAL_BACKEND_URL=${INTERNAL_BACKEND_URL:-http://backend:8000}
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BASE_URL:?NEXT_PUBLIC_BASE_URL must be set in .env.production}
      - DASHBOARD_API_ORIGIN=${DASHBOARD_API_ORIGIN:-http://backend:8000}
      - DASHBOARD_COOKIE_SECURE=${DASHBOARD_COOKIE_SECURE:-false}
      - PORT=3100
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dch_network

  # 7. High-Performance Nginx Reverse Proxy (HTTP-only first boot)
  nginx:
    image: nginx:alpine
    container_name: dch_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
      - certbot_certs:/etc/letsencrypt
      - certbot_challenge:/var/www/certbot
    depends_on:
      - frontend
      - backend
      - dashboard
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dch_network

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  certbot_certs:
  certbot_challenge:

networks:
  dch_network:
    driver: bridge
