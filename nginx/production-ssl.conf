# ==============================================================================
# DREAM CAR HOUSE - Production Nginx Configuration with SSL (Cloudflare Origin CA)
# ==============================================================================
# IMPORTANT CLOUDFLARE SSL NOTICE:
# Cloudflare SSL/TLS encryption mode MUST be set to "Full (strict)".
# DO NOT USE "Flexible" mode!
#
# WHY:
# In "Flexible" mode, Cloudflare connects to your origin server exclusively over
# HTTP (port 80). When Nginx sees HTTP, it returns a 301 redirect to HTTPS.
# Cloudflare receives this redirect and requests port 80 again, creating an
# infinite HTTP 301 redirect loop (ERR_TOO_MANY_REDIRECTS).
# With "Full (strict)", Cloudflare communicates end-to-end over HTTPS (port 443)
# and validates the Origin CA certificate installed on your origin server.
# ==============================================================================

upstream frontend_upstream {
    server frontend:3000;
    keepalive 32;
}

upstream dashboard_upstream {
    server dashboard:3100;
    keepalive 32;
}

upstream backend_upstream {
    server backend:8000;
    keepalive 32;
}

# Map POST method for admin login rate limiting (GET requests to view login page are never throttled)
map $request_method $admin_login_post {
    POST $binary_remote_addr;
    default "";
}

# Rate Limiting Zones (Brute Force Protection)
limit_req_zone $admin_login_post zone=admin_login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_auth_limit:10m rate=10r/m;
limit_req_status 429;

# Gzip Compression for Ultra-Fast Page Loading
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_buffers 16 8k;
gzip_http_version 1.1;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/javascript
    application/json
    application/javascript
    application/x-javascript
    text/xml
    application/xml
    application/xml+rss
    image/svg+xml;

# HTTP -> HTTPS Redirection (Port 80)
server {
    listen 80;
    server_name dreamcarhouse.com www.dreamcarhouse.com _;

    server_tokens off;

    # Let's Encrypt / Certbot Challenge Directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server (Port 443)
server {
    listen 443 ssl http2;
    server_name dreamcarhouse.com www.dreamcarhouse.com;

    # Disable Nginx version banner and hide upstream X-Powered-By
    server_tokens off;
    proxy_hide_header X-Powered-By;

    # HSTS (HTTPS only, 1 hour initial rollout)
    add_header Strict-Transport-Security "max-age=3600" always;

    # Cloudflare Origin CA Certificates
    ssl_certificate /etc/ssl/cloudflare/cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/key.pem;

    # Modern TLS Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Maximum upload size for high-res luxury car photos
    client_max_body_size 50M;

    # Cloudflare Real-IP Resolution (Restores true client IP for Nginx, Django, and GeoIP)
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Block hidden dotfiles except ACME challenge
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Static Assets collected from Django
    location /static/ {
        alias /var/www/static/;
        add_header Strict-Transport-Security "max-age=3600" always;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Media Files (Car Photos, Showroom Images)
    location /media/ {
        alias /var/www/media/;
        add_header Strict-Transport-Security "max-age=3600" always;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Django Admin Login endpoint with rate limiting on POST
    location = /admin/login/ {
        limit_req zone=admin_login_limit burst=5 nodelay;
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Django Admin Portal (Generous browsing limit)
    location /admin/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # API Authentication Endpoints (JWT / Login) with Rate Limiting
    location ~ ^/api/v1/(dashboard/auth/|token/) {
        limit_req zone=api_auth_limit burst=5 nodelay;
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Django REST API (v1)
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Immutable Dashboard Next.js Static Chunks
    location ^~ /_dashboard_next/_next/static/ {
        rewrite ^/_dashboard_next/(.*)$ /$1 break;
        proxy_pass http://dashboard_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Strict-Transport-Security "max-age=3600" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Custom Dashboard Next.js Assets (eliminates clash with frontend /_next/)
    location /_dashboard_next/ {
        rewrite ^/_dashboard_next/(.*)$ /$1 break;
        proxy_pass http://dashboard_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Custom Dashboard Login Route with Rate Limiting
    location = /login {
        limit_req zone=admin_login_limit burst=5 nodelay;
        proxy_pass http://dashboard_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Custom Node.js/Next.js Dynamic Workspace Dashboard
    location /workspace {
        proxy_pass http://dashboard_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Immutable Frontend Next.js Static Chunks
    location ^~ /_next/static/ {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Strict-Transport-Security "max-age=3600" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Public Next.js Luxury Frontend (SSR / ISR)
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        add_header Strict-Transport-Security "max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}

